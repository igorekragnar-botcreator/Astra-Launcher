# launcher name & url
launcher_name=Astra
launcher_app_name=Astra Launcher
launcher_short_name=Astra
url_home=https://github.com/igorekragnar-botcreator/astra-launcher

# Release signing: astra.jks is NOT in this repository and never should be.
# Supply the passwords through environment variables (STORE_PASSWORD,
# KEY_PASSWORD), a root-level .store_password.txt / .key_password.txt, or your
# own gradle.properties, then drop your own keystore at ZalithLauncher/astra.jks.
#astra_store_password=
#astra_key_password=

# your OAuth client id
#oauth_client_id=xxx

# your CurseForge API key
#curseforge_api_key=xxx

# Debug signing only: zalith_launcher_debug.jks is the public Android SDK debug
# key, committed here so anyone can build and side-load a debug APK. These two
# passwords unlock that dev key and nothing else.
default_store_password=vh#nn%N(#eNjwfA78-77s6&f-cdd(@-7eana-e%!nhj%))!@c
default_key_password=sfv72ghSSNQaadf99-Q69!2

# launcher version
launcher_version_code=10500
launcher_version_name=1.5